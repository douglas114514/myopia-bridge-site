<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyopiaBridge · Page views</title>
<style>body{font:16px system-ui;background:#f4f6f9;color:#14181c;margin:0;padding:32px}main{max-width:640px;margin:40px auto;background:white;padding:32px;border-radius:12px}h1{font-size:25px}label{display:block;margin:20px 0 8px}input,button{font:inherit;padding:12px;border-radius:6px;border:1px solid #ccc}input{box-sizing:border-box;width:100%}button{background:#0e5fc0;color:white;margin-top:12px;cursor:pointer}#total{font-size:64px;margin:16px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}#status{color:#454c54}small{color:#454c54}</style></head>
<body><main><h1>MyopiaBridge page views</h1><p>Your private total across all visitors.</p>
<form id="login"><label for="password">Counter password</label><input id="password" type="password" autocomplete="current-password" required><button>Show total</button></form>
<p id="status" role="status"></p><section id="results" hidden><div id="total"></div><small>Recorded page views since installation · daily dates use UTC</small><p><button id="refresh">Refresh</button> <button id="logout">Lock</button></p><table><thead><tr><th>Date</th><th>Views</th></tr></thead><tbody id="daily"></tbody></table></section>
</main><script>
let token = '';
const status = document.getElementById('status');
async function load() {
  status.textContent = 'Loading…';
  try {
    const response = await fetch('/stats', {headers: {Authorization: 'Bearer ' + token}, cache: 'no-store'});
    if (!response.ok) throw new Error(response.status === 401 ? 'Incorrect password.' : 'Counter unavailable. Try again.');
    const data = await response.json();
    document.getElementById('total').textContent = data.total.toLocaleString();
    const tbody = document.getElementById('daily'); tbody.replaceChildren();
    data.daily.forEach(row => { const tr = document.createElement('tr'); [row.day, row.views.toLocaleString()].forEach(value => { const td = document.createElement('td'); td.textContent = value; tr.append(td); }); tbody.append(tr); });
    document.getElementById('results').hidden = false;
    document.getElementById('login').hidden = true;
    status.textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (error) { status.textContent = error.message; }
}
document.getElementById('login').addEventListener('submit', event => {event.preventDefault(); token = document.getElementById('password').value; document.getElementById('password').value = ''; load();});
document.getElementById('refresh').addEventListener('click', load);
document.getElementById('logout').addEventListener('click', () => {token = ''; document.getElementById('results').hidden = true; document.getElementById('daily').replaceChildren(); document.getElementById('total').textContent = ''; document.getElementById('login').hidden = false; status.textContent = '';});
</script></body></html>
